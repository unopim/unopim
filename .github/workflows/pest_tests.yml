name: Pest Tests

# A branch push and its own pull request are the same commit, so pushes are
# limited to the release lines and everything else arrives through the PR event.
on:
  push:
    branches: [master, '2.1']
  pull_request:

# head_ref is the branch on a pull request and empty elsewhere, which keeps a
# branch's runs in one group no matter which event opened them.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-24.04
    name: Pest Tests (MySQL)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
          --tmpfs /tmp:rw,noexec,nosuid,size=100m

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runtime front-end packages only; tests assert against the shipped
      # vue-multiselect distribution.
      - name: Install Node dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1wk_|" .env

      - name: Running UnoPim Installer
        run: php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data

      - name: Set Passport OAuth key permissions
        run: chmod 0600 packages/Webkul/AdminApi/src/Secrets/Oauth/oauth-*.key

      - name: Running Pest Tests
        # Each worker owns a database clone. The suite runs as two halves so
        # every half starts with fresh workers: per-process memory grows over
        # thousands of tests and a single long run ends with a worker
        # OOM-killed (exit 137), which aborts paratest mid-run.
        # The teamcity log streams per-test results, so it survives a crashed
        # worker where a junit report would not.
        run: |
          vendor/bin/pest --parallel --processes=3 --colors=always --log-teamcity pest-teamcity-1.log --testsuite "Api Feature Test,Core Unit Test,DataTransfer Unit Test,User Feature Test,Admin Feature Test"
          vendor/bin/pest --parallel --processes=3 --colors=always --log-teamcity pest-teamcity-2.log --testsuite "Installer Feature Test,ElasticSearch Feature Test,Completeness Feature Test,Product Unit Test,Product Feature Test,Attribute Unit Test,Category Unit Test,Measurement Feature Test,AiAgent Unit Test,AppUrlGuard Unit Test,Webhook Unit Test,AppUrlGuard Feature Test,Resource Unit Test,Resource Feature Test,Publication Feature Test,ProductPassport Feature Test"

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pest-mysql-teamcity
          path: pest-teamcity-*.log
          if-no-files-found: ignore

  pest-elasticsearch:
    runs-on: ubuntu-24.04
    name: Pest Tests (MySQL + Elasticsearch)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
          --tmpfs /tmp:rw,noexec,nosuid,size=100m

      elasticsearch:
        image: elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms256m -Xmx256m'
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runtime front-end packages only; tests assert against the shipped
      # vue-multiselect distribution.
      - name: Install Node dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env

      - name: Running UnoPim Installer
        run: php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data

      - name: Enable Elasticsearch and build indexes
        run: |
          sed -i "s|^\(ELASTICSEARCH_ENABLED=\s*\).*$|\1true|" .env
          sed -i "s|^\(ELASTICSEARCH_HOST=\s*\).*$|\1http://127.0.0.1:9200|" .env
          sed -i "s|^\(ELASTICSEARCH_INDEX_PREFIX=\s*\).*$|\1unopim_test|" .env
          php artisan config:clear
          curl -s http://127.0.0.1:9200/_cluster/health | python3 -m json.tool
          php artisan unopim:product:index
          php artisan unopim:category:index

      - name: Set Passport OAuth key permissions
        run: chmod 0600 packages/Webkul/AdminApi/src/Secrets/Oauth/oauth-*.key

      - name: Running Pest Tests
        # Each worker owns a database clone. The suite runs as two halves so
        # every half starts with fresh workers: per-process memory grows over
        # thousands of tests and a single long run ends with a worker
        # OOM-killed (exit 137), which aborts paratest mid-run.
        run: |
          vendor/bin/pest --parallel --processes=3 --colors=always --testsuite "Api Feature Test,Core Unit Test,DataTransfer Unit Test,User Feature Test,Admin Feature Test"
          vendor/bin/pest --parallel --processes=3 --colors=always --testsuite "Installer Feature Test,ElasticSearch Feature Test,Completeness Feature Test,Product Unit Test,Product Feature Test,Attribute Unit Test,Category Unit Test,Measurement Feature Test,AiAgent Unit Test,AppUrlGuard Unit Test,Webhook Unit Test,AppUrlGuard Feature Test,Resource Unit Test,Resource Feature Test,Publication Feature Test,ProductPassport Feature Test"

  # Fast pull-request signal alongside the full suites: Pest's Test Impact Analysis
  # runs only the tests reached by the changed files. With no cached graph (or a
  # stale one) it falls back to the whole suite and records a new graph.
  # Advisory: the full matrix above is the merge gate; this experiments with
  # test-impact analysis, whose coverage recording is memory-fragile on the
  # shared runners.
  pest-impacted:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    name: Pest Tests (impacted)
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
          --tmpfs /tmp:rw,noexec,nosuid,size=100m

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Impact analysis diffs against the merge base, which needs real history.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          # pcov instruments every file it loads, and the graph only cares about
          # our own source, so keeping vendor out of it is what keeps the
          # recording inside the runner's memory.
          ini-values: error_reporting=E_ALL, pcov.exclude="~(vendor|node_modules|storage)~"
          tools: composer:v2
          # The dependency graph is recorded from coverage data.
          coverage: pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runtime front-end packages only; tests assert against the shipped
      # vue-multiselect distribution.
      - name: Install Node dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      # Pest keeps the graph under $HOME/.pest/tia/<project-key>, not in the workspace.
      - name: Resolve the test impact graph path
        id: tia
        run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

      - name: Restore the test impact graph
        uses: actions/cache@v4
        with:
          path: ${{ steps.tia.outputs.path }}
          key: pest-tia-${{ runner.os }}-${{ hashFiles('composer.lock') }}-${{ github.run_id }}
          restore-keys: |
            pest-tia-${{ runner.os }}-${{ hashFiles('composer.lock') }}-
            pest-tia-${{ runner.os }}-

      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1wk_|" .env

      - name: Running UnoPim Installer
        run: php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data

      - name: Set Passport OAuth key permissions
        run: chmod 0600 packages/Webkul/AdminApi/src/Secrets/Oauth/oauth-*.key

      # Coverage recording peaks past the runner's 7 GB (exit 137); swap absorbs
      # the spike. The runner already holds /swapfile open, so the extra file
      # goes on /mnt, which is both free and the larger disk.
      - name: Add swap headroom for coverage recording
        run: |
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show

      # A second worker doubles the resident coverage map and still gets killed
      # with the swap in place, so this job trades its parallelism for headroom.
      - name: Running impacted Pest tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: vendor/bin/pest --parallel --processes=1 --tia --colors=always
