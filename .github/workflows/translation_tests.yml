name: Translation Tests

# A branch push and its own pull request are the same commit, so pushes are
# limited to the release lines and everything else arrives through the PR event.
on:
  push:
    branches: [master, '3.x']
  pull_request:

# head_ref is the branch on a pull request and empty elsewhere, which keeps a
# branch's runs in one group no matter which event opened them.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translation_tests:
    runs-on: ubuntu-24.04
    name: Translation Integrity Audit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Translation Checker
        run: php artisan unopim:translations:check
