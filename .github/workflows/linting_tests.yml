name: Linting Tests

# A branch push and its own pull request are the same commit, so pushes are
# limited to the release lines and everything else arrives through the PR event.
on:
  push:
    branches: [master, '3.x']
  pull_request:

# head_ref is the branch on a pull request and empty elsewhere, which keeps a
# branch's runs in one group no matter which event opened them.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linting_tests:
    if: github.repository == 'unopim/unopim'
    runs-on: ubuntu-24.04
    name: Laravel Pint Code Style

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--prefer-dist --no-scripts"

      - name: Run Pint
        run: vendor/bin/pint --test
