name: Linting Tests

# A branch push and its own pull request are the same commit, so pushes are
# limited to the release lines and everything else arrives through the PR event.
on:
  push:
    branches: [master, '3.x']
  pull_request:

# head_ref is the branch on a pull request and empty elsewhere, which keeps a
# branch's runs in one group no matter which event opened them.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linting_tests:
    runs-on: ubuntu-24.04
    name: Laravel Pint Code Style

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist --no-scripts"

      - name: Run Pint
        run: vendor/bin/pint --test
