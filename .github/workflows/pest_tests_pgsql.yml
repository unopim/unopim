name: Pest Tests (PostgreSQL)

# A branch push and its own pull request are the same commit, so pushes are
# limited to the release lines and everything else arrives through the PR event.
on:
  push:
    branches: [master, '3.0']
  pull_request:

# head_ref is the branch on a pull request and empty elsewhere, which keeps a
# branch's runs in one group no matter which event opened them.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest-pgsql:
    runs-on: ubuntu-24.04
    name: Pest Tests (PostgreSQL)
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unopim
          POSTGRES_PASSWORD: unopim
          POSTGRES_DB: unopim
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unopim"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=600m

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_pgsql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm install --omit=dev --no-audit --no-fund --no-progress --prefer-offline

      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1pgsql|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\15432|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1unopim|" .env

      - name: Running UnoPim Installer
        run: php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data

      - name: Set Passport OAuth key permissions
        run: chmod 0600 packages/Webkul/AdminApi/src/Secrets/Oauth/oauth-*.key

      - name: Running Pest Tests
        # Each worker owns a database clone. The suite runs as two halves so
        # every half starts with fresh workers: per-process memory grows over
        # thousands of tests and a single long run ends with a worker
        # OOM-killed (exit 137), which aborts paratest mid-run.
        run: |
          vendor/bin/pest --parallel --processes=3 --colors=always --testsuite "Api Feature Test,Core Unit Test,DataTransfer Unit Test,User Feature Test,Admin Feature Test"
          vendor/bin/pest --parallel --processes=3 --colors=always --testsuite "Installer Feature Test,ElasticSearch Feature Test,Completeness Feature Test,Product Unit Test,Product Feature Test,Attribute Unit Test,Category Unit Test,Measurement Feature Test,AiAgent Unit Test,AppUrlGuard Unit Test,Webhook Unit Test,AppUrlGuard Feature Test,Resource Unit Test,Resource Feature Test,Publication Feature Test,ProductPassport Feature Test"

  pest-pgsql-elasticsearch:
    runs-on: ubuntu-24.04
    name: Pest Tests (PostgreSQL + Elasticsearch)
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unopim
          POSTGRES_PASSWORD: unopim
          POSTGRES_DB: unopim
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unopim"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=600m

      elasticsearch:
        image: elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms256m -Xmx256m'
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_pgsql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm install --omit=dev --no-audit --no-fund --no-progress --prefer-offline

      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1pgsql|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\15432|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1unopim|" .env

      - name: Running UnoPim Installer
        run: php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data

      - name: Enable Elasticsearch and build indexes
        run: |
          sed -i "s|^\(ELASTICSEARCH_ENABLED=\s*\).*$|\1true|" .env
          sed -i "s|^\(ELASTICSEARCH_HOST=\s*\).*$|\1http://127.0.0.1:9200|" .env
          sed -i "s|^\(ELASTICSEARCH_INDEX_PREFIX=\s*\).*$|\1unopim_test|" .env
          php artisan config:clear
          curl -s http://127.0.0.1:9200/_cluster/health | python3 -m json.tool
          php artisan unopim:product:index
          php artisan unopim:category:index

      - name: Set Passport OAuth key permissions
        run: chmod 0600 packages/Webkul/AdminApi/src/Secrets/Oauth/oauth-*.key

      - name: Running Pest Tests
        # Each worker owns a database clone. The suite runs as two halves so
        # every half starts with fresh workers: per-process memory grows over
        # thousands of tests and a single long run ends with a worker
        # OOM-killed (exit 137), which aborts paratest mid-run.
        run: |
          vendor/bin/pest --parallel --processes=3 --colors=always --testsuite "Api Feature Test,Core Unit Test,DataTransfer Unit Test,User Feature Test,Admin Feature Test"
          vendor/bin/pest --parallel --processes=3 --colors=always --testsuite "Installer Feature Test,ElasticSearch Feature Test,Completeness Feature Test,Product Unit Test,Product Feature Test,Attribute Unit Test,Category Unit Test,Measurement Feature Test,AiAgent Unit Test,AppUrlGuard Unit Test,Webhook Unit Test,AppUrlGuard Feature Test,Resource Unit Test,Resource Feature Test,Publication Feature Test,ProductPassport Feature Test"
