name: Playwright Tests

# A pull request runs a short smoke pass over the core admin save flows so a
# broken create/edit page shows up in review. The full suite gates the merge
# queue and runs on every push to a release line. Specs that call a live AI
# provider only get credentials on the nightly run, so a provider renaming or
# retiring a model cannot block a merge.
#
# A branch push and its own pull request are the same commit, so pushes are
# limited to the release lines and everything else arrives through the PR event.
on:
  push:
    branches: [master, '3.x']
  pull_request:
  merge_group:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# head_ref is the branch on a pull request and empty elsewhere, which keeps a
# branch's runs in one group no matter which event opened them. The nightly run
# gets its own group so a push to the release line does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  playwright_tests:
    if: github.repository == 'unopim/unopim' && github.event_name != 'pull_request'
    name: Playwright E2E | Shard ${{ matrix.shard-index }}/${{ matrix.shard-total }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard-index: [1,2,3,4,5,6,7,8]
        shard-total: [8]

    services:
      mysql: &mysql-service
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
          --tmpfs /tmp:rw,noexec,nosuid,size=100m

    env:
      # Live-provider specs skip without a key, so only the nightly and manual runs get one.
      OPENAI_API_KEY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.OPENAI_API_KEY || '' }}
      UNOPIM_URL: ${{ secrets.UNOPIM_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      INVALID_ADMIN_EMAIL: ${{ secrets.INVALID_ADMIN_EMAIL }}
      INVALID_ADMIN_PASSWORD: ${{ secrets.INVALID_ADMIN_PASSWORD }}
      # E2E only: lets webhook-delivery.spec.js point UnoPim at a localhost
      # catcher (127.0.0.1:<port>). SafeWebhookUrl blocks loopback by default
      # in prod; this flag re-allows loopback ONLY — private / link-local /
      # multicast / reserved IP ranges stay blocked.
      WEBHOOK_ALLOW_LOOPBACK: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fall back to the same literal creds login.js defaults to, so the seeded
      # admin always matches the test login even when these repo secrets are
      # unset (e.g. fork PRs). Without a fallback the seeder generates a RANDOM
      # password and every login — and thus every E2E test — fails.
      - name: Set up UnoPim
        uses: ./.github/actions/e2e-setup
        with:
          admin-email: ${{ secrets.INSTALLER_ADMIN_EMAIL || 'admin@example.com' }}
          admin-password: ${{ secrets.INSTALLER_ADMIN_PASSWORD || 'admin123' }}

      - name: Run Playwright tests
        env:
          PASSPORT_E2E_LOCAL: '1'
          PW_WORKERS: '3'
          # Duration-balanced file sets instead of --shard's equal test counts (see shard-balance.js).
          PW_SHARD: ${{ matrix.shard-index }}/${{ matrix.shard-total }}
        # @global-state specs change store-wide settings, so they run after the
        # rest on one worker. Both passes always run and either one fails the step.
        run: |
          cd tests/e2e-pw
          status=0
          PW_PASS=parallel npx playwright test --pass-with-no-tests || status=$?
          PW_PASS=serial npx playwright test --pass-with-no-tests || status=$?
          exit $status

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard-index }}-${{ github.run_id }}
          path: |
            tests/e2e-pw/playwright-report
            tests/e2e-pw/playwright-report-serial
            tests/e2e-pw/test-results
            tests/e2e-pw/test-results-serial
            storage/logs/*.log
            /tmp/server.log
            /tmp/queue.log
            storage/logs/laravel.log
          retention-days: 7

  # A short pass over the admin flows every change can break: sign-in, ajax
  # navigation, the shared ajax form save and the catalog create/edit pages.
  playwright_smoke:
    if: github.repository == 'unopim/unopim' && github.event_name == 'pull_request'
    name: Playwright E2E | Smoke
    runs-on: ubuntu-24.04

    services:
      mysql: *mysql-service

    env:
      WEBHOOK_ALLOW_LOOPBACK: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up UnoPim
        uses: ./.github/actions/e2e-setup
        with:
          admin-email: ${{ secrets.INSTALLER_ADMIN_EMAIL || 'admin@example.com' }}
          admin-password: ${{ secrets.INSTALLER_ADMIN_PASSWORD || 'admin123' }}

      - name: Run Playwright smoke specs
        env:
          PASSPORT_E2E_LOCAL: '1'
          PW_WORKERS: '3'
        run: |
          cd tests/e2e-pw
          npx playwright test \
            tests/07-ui-loginpage/loginpage.spec.js \
            tests/10-navigation/ajax-nav.spec.js \
            tests/form-save-feedback.spec.js \
            tests/01-catalog/attribute.spec.js \
            tests/01-catalog/attributefamily.spec.js \
            tests/01-catalog/category.spec.js \
            tests/01-catalog/products.spec.js

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke-${{ github.run_id }}
          path: |
            tests/e2e-pw/playwright-report
            tests/e2e-pw/test-results
            storage/logs/laravel.log
            /tmp/server.log
            /tmp/queue.log
          retention-days: 7

  # A skipped matrix job reports its check under the unexpanded name, which can
  # never satisfy a required check. This stand-in reports the expanded names on
  # a pull request so it can enter the merge queue, where the real job runs.
  playwright_tests_pull_request:
    if: github.repository == 'unopim/unopim' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    name: Playwright E2E | Shard ${{ matrix.shard-index }}/${{ matrix.shard-total }}
    strategy:
      matrix:
        shard-index: [1,2,3,4,5,6,7,8]
        shard-total: [8]
    steps:
      - name: Defer to the merge queue
        run: echo "::notice::Playwright E2E runs in the merge queue and on the release lines."

  # The nightly run is the only one with live AI credentials and nobody watches
  # it, so a failure opens (or comments on) a tracking issue.
  report_nightly_failure:
    needs: playwright_tests
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly Playwright E2E is failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "The nightly Playwright run failed: $RUN_URL"
          fi
