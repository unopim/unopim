name: TIA Baseline

# Records Pest's test-impact graph once per push to the release branches and
# publishes it as an artifact. `pest()->tia()->baselined()` makes every developer
# and pull request download it, so nobody pays the recording cost locally.

on:
  push:
    branches: [master, '3.0']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A run that records nothing must not report success: Pest takes the newest
  # successful run, so an empty one masks the last that published a graph.
  baseline:
    runs-on: ubuntu-24.04
    name: Record the test impact baseline

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
          --tmpfs /tmp:rw,noexec,nosuid,size=100m

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          # PcovRestarter rebuilds the child from Pest's argv, dropping every `-d`,
          # so anything the recording needs has to come from php.ini. Pinning
          # pcov.directory to what it would pick anyway also keeps it from
          # re-execing, and proc_close() reports 9 for both a signalled child and
          # a plain exit(9) — the shell tells them apart, that wrapper cannot.
          ini-values: error_reporting=E_ALL, memory_limit=-1, pcov.directory=${{ github.workspace }}, pcov.exclude="~(vendor|node_modules|storage)~"
          tools: composer:v2
          coverage: pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm install --omit=dev --no-audit --no-fund --no-progress --prefer-offline

      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1wk_|" .env

      - name: Running UnoPim Installer
        run: php artisan unopim:install --skip-env-check --skip-admin-creation

      # The runner already holds /swapfile open, so the extra file goes on /mnt.
      - name: Add swap headroom for coverage recording
        run: |
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h
          df -h /mnt /

      # Pest records nothing for a partial run, so this cannot be split up.
      - name: Record the baseline
        env:
          # tests/Pest.php caps memory at 1024M unless this says otherwise.
          PEST_MEMORY_LIMIT: '-1'
        run: |
          # 1s, or the kill lands inside an unsampled gap.
          ( while true; do
              printf '%s rss=%sk avail=%s swapfree=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(ps -eo rss,comm --sort=-rss | awk '$2 ~ /php/ {s+=$1} END {print s+0}')" \
                "$(awk '/MemAvailable/ {print $2}' /proc/meminfo)" \
                "$(awk '/SwapFree/ {print $2}' /proc/meminfo)"
              sleep 1
            done ) > "$RUNNER_TEMP/memory.log" 2>&1 &
          sampler=$!

          set +e
          php vendor/bin/pest --tia --fresh --colors=always
          status=$?
          set -e

          kill "$sampler" 2>/dev/null || true

          echo '--- peak memory during recording ---'
          sort -t= -k2 -n "$RUNNER_TEMP/memory.log" | tail -5

          if [ "$status" -ne 0 ]; then
            # With pcov.directory pinned there is no re-exec left to launder a
            # signal into a plain number, so the shell's status can be taken at
            # face value: >128 is a signal, and 9 is now something that really
            # chose to exit 9.
            if [ "$status" -gt 128 ] && [ "$status" -lt 192 ]; then
              echo "::error::the recording process was killed by signal $((status - 128)), not by a failing test"
            elif [ "$status" -eq 9 ]; then
              echo "::error::the recording process exited 9 of its own accord — no re-exec remains to disguise a signal, and Pest returns only 0, 1 or 2, so the source is outside the runner"
            else
              echo "::error::the recording run exited with $status"
            fi

            free -h || true
            swapon --show || true
            df -h /mnt / || true

            echo '--- kernel log (an OOM kill is recorded here) ---'
            sudo dmesg | tail -50 || true

            # A cgroup kill counts here even when it leaves no ring buffer entry.
            # The counters live in the step's own cgroup; the root has none.
            echo '--- cgroup memory events ---'
            cgroup="$(cut -d: -f3 /proc/self/cgroup | head -1)"
            cat "/sys/fs/cgroup${cgroup}/memory.events" 2>/dev/null \
              || cat /sys/fs/cgroup/memory.events 2>/dev/null || true
            cat "/sys/fs/cgroup${cgroup}/memory.peak" 2>/dev/null \
              || cat /sys/fs/cgroup/memory.peak 2>/dev/null || true

            exit "$status"
          fi

          graph="$(vendor/bin/pest --baseline)/graph.json"

          if [ ! -f "$graph" ]; then
            echo "::error::the run recorded no graph at $graph"
            exit 1
          fi

      - name: Resolve the baseline path
        id: baseline
        run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

      - name: Upload the baseline
        uses: actions/upload-artifact@v4
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline.outputs.path }}
          include-hidden-files: true
          retention-days: 30
