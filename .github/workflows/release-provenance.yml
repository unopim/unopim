name: Release Provenance

# Attaches a source archive and its SLSA build provenance to every GitHub
# release, so users can verify a download came from this repository at that
# tag. Release-only: the generator attests the triggering ref, so a manual run
# for an older tag would describe the wrong source.
on:
  release:
    types: [published]

permissions: read-all

jobs:
  archive:
    if: github.repository == 'unopim/unopim'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Build source archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git archive --format=tar.gz --prefix="unopim-${TAG#v}/" -o "unopim-${TAG}.tar.gz" HEAD

      - name: Hash archive
        id: hash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "hashes=$(sha256sum "unopim-${TAG}.tar.gz" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" "unopim-${TAG}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  provenance:
    needs: archive
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generator must be referenced by tag, not SHA, for its provenance to verify.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.archive.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.archive.outputs.tag }}
      provenance-name: unopim-${{ needs.archive.outputs.tag }}.intoto.jsonl
