# =============================================================================
# UnoPim Apache Override
# =============================================================================
# Replaces Nginx + PHP-FPM with Apache + mod_php (single container).
#
# Usage:
#   docker compose -f compose.dev.yaml -f compose.dev.apache.yaml up -d
#
# Or set in .env:
#   COMPOSE_FILE=compose.dev.yaml:compose.dev.apache.yaml
#
# Database choice is independent of the web server — see COMPOSE_PROFILES
# in compose.dev.yaml.
# =============================================================================

services:
  # Disable Nginx and FPM (replaced by Apache)
  unopim-nginx:
    deploy:
      replicas: 0

  unopim-fpm:
    deploy:
      replicas: 0

  # Apache + PHP (replaces Nginx + FPM)
  unopim-web:
    build:
      context: .
      dockerfile: dockerfiles/web.Dockerfile
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8000}:80"
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-unopim-pgsql}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_HOST: unopim-redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: unopim-elasticsearch:9200
      MAIL_HOST: unopim-mailpit
      MAIL_PORT: 1025
    depends_on:
      unopim-pgsql:
        condition: service_healthy
        required: false
      unopim-mysql:
        condition: service_healthy
        required: false
      unopim-redis:
        condition: service_healthy
      unopim-elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
